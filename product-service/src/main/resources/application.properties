quarkus.application.name=product-service
quarkus.http.port=8082

#postgre db config
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/products_db

## RabbitMQ Configuration
#rabbitmq-host=localhost
#rabbitmq-port=5672
#rabbitmq-username=guest
#rabbitmq-password=guest

# Outgoing channel - Product Events
mp.messaging.outgoing.product-events.connector=smallrye-rabbitmq
mp.messaging.outgoing.product-events.exchange.name=product-events-exchange
mp.messaging.outgoing.product-events.exchange.type=topic
mp.messaging.outgoing.product-events.exchange.durable=true
mp.messaging.outgoing.product-events.routing-key=product.#

#rest client
quarkus.rest-client.review-service.url=http://localhost:8083

#gRPC server
quarkus.grpc.server.port=9082

#oidc config
quarkus.oidc.application-type=service

#prod oidc config
%prod.quarkus.oidc.auth-server-url=http://localhost:8180/realms/jewelry-store
%prod.quarkus.oidc.client-id=backend-service
%prod.quarkus.oidc.credentials.secret=backend-secret
%prod.quarkus.oidc.application-type=service

#token validation
%prod.quarkus.oidc.token.issuer=http://localhost:8180/realms/jewelry-store

#security
%prod.quarkus.http.auth.permission.authenticated.paths=/api/*
%prod.quarkus.http.auth.permission.authenticated.policy=authenticated

#logging
quarkus.log.category."io.quarkus.oidc".level=DEBUG