quarkus.application.name=product-service
quarkus.http.port=8082

#rest client
quarkus.rest-client.review-service.url=http://localhost:8083

#gRPC server
quarkus.grpc.server.port=9082

#oidc config
quarkus.oidc.application-type=service

#prod oidc config
%prod.quarkus.oidc.auth-server-url=http://localhost:8180/realms/jewelry-store
%prod.quarkus.oidc.client-id=backend-service
%prod.quarkus.oidc.credentials.secret=backend-secret
%prod.quarkus.oidc.application-type=service

#token validation
%prod.quarkus.oidc.token.issuer=http://localhost:8180/realms/jewelry-store

#security
%prod.quarkus.http.auth.permission.authenticated.paths=/api/*
%prod.quarkus.http.auth.permission.authenticated.policy=authenticated

#logging
quarkus.log.category."io.quarkus.oidc".level=DEBUG