# OIDC Configuration for Production
%prod.quarkus.oidc.auth-server-url=http://localhost:8180/realms/jewelry-store
%prod.quarkus.oidc.client-id=frontend-client
%prod.quarkus.oidc.credentials.secret=your-production-secret-here
%prod.quarkus.oidc.application-type=web-app

# Disable Dev Services in production
%prod.quarkus.keycloak.devservices.enabled=false

# OIDC paths
%prod.quarkus.oidc.authentication.redirect-path=/
%prod.quarkus.oidc.authentication.restore-path-after-redirect=true

# REST Clients for production
%prod.quarkus.rest-client.product-service.url=http://localhost:8082
%prod.quarkus.rest-client.order-service.url=http://localhost:8081
%prod.quarkus.rest-client.review-service.url=http://localhost:8083

# Logging
%prod.quarkus.log.level=INFO
%prod.quarkus.log.console.enable=true