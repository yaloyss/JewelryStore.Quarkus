<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jewelry Store</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 90%;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
    }
    .info {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 30px;
    }
    .btn {
      padding: 15px 30px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background 0.3s;
      font-size: 16px;
      display: block;
    }
    .btn:hover {
      background: #5568d3;
    }
    .btn-login {
      background: #764ba2;
    }
    .btn-login:hover {
      background: #63408a;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>˖ ࣪⊹𐙚 Jewelry Store</h1>
  <p class="info">Welcome to our online jewelry shop</p>
  <p class="info">Please log in to browse products, view orders and read reviews</p>
  <div class="nav-links">
    <a href="/home" class="btn btn-login">Login & Continue</a>
  </div>
</div>
</body>
</html>
