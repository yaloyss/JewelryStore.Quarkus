quarkus.http.port=8080

# CORS for React dev server
quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:5173
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
%dev.quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
%dev.quarkus.http.cors.access-control-allow-credentials=true

# DEV
%dev.quarkus.oidc.enabled=false


#oidc config for dev
# PROD SECURITY
%prod.quarkus.http.auth.permission.all-resources.paths=/*
%prod.quarkus.http.auth.permission.all-resources.policy=authenticated

# PROD OIDC
%prod.quarkus.oidc.application-type=web_app
%prod.quarkus.oidc.logout.path=/logout

#rest client
quarkus.rest-client.product-service.url=http://localhost:8082
quarkus.rest-client.order-service.url=http://localhost:8081
quarkus.rest-client.review-service.url=http://localhost:8083

#security policy
#quarkus.http.auth.permission.public.paths=/,/index.html
#uarkus.http.auth.permission.public.policy=permit
#uarkus.http.auth.permission.authenticated.paths=/home,/products,/orders,/reviews
#uarkus.http.auth.permission.authenticated.policy=authenticated

#logging
quarkus.log.category."io.quarkus.oidc".level=DEBUG